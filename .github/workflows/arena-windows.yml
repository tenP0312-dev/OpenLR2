name: Arena Windows build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            generator_arch: x64
            triplet: x64-windows-static-release
            executable: OpenLR2_x64.exe
          - arch: x86
            generator_arch: Win32
            triplet: x86-windows-static
            executable: OpenLR2_x86.exe

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Configure
        shell: pwsh
        run: |
          if (-not $env:VCPKG_ROOT) {
            $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          }
          if (-not (Test-Path "$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake")) {
            throw "VCPKG_ROOT does not contain the vcpkg CMake toolchain"
          }
          cmake -S . -B "build/${{ matrix.arch }}" `
            -G "Visual Studio 17 2022" `
            -A "${{ matrix.generator_arch }}" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="${{ matrix.triplet }}" `
            -DOPENLR2_ARENA_BUILD_HASH="${{ github.event.pull_request.head.sha }}" `
            -DBUILD_TESTING=ON

      - name: Build
        run: >-
          cmake --build "build/${{ matrix.arch }}"
          --config RelWithDebInfo
          --target OpenLR2 BMSIRArenaProtocolTest
          --parallel

      - name: Test protocol helpers
        run: >-
          ctest --test-dir "build/${{ matrix.arch }}"
          -C RelWithDebInfo
          --output-on-failure

      - name: Stage direct-test package
        shell: pwsh
        run: |
          $version = "0.2.0-dev-openlr2"
          $packageName = "OpenLR2-BMSIR-Arena-$version-${{ matrix.arch }}"
          $packageRoot = "package/${{ matrix.arch }}/$packageName"
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          Copy-Item `
            "build/${{ matrix.arch }}/RelWithDebInfo/${{ matrix.executable }}" `
            "$packageRoot/${{ matrix.executable }}"
          Copy-Item BMSIR_ARENA.md "$packageRoot/README.md"
          Copy-Item BMSIR_ARENA.example.json "$packageRoot/BMSIR_ARENA.example.json"
          Compress-Archive `
            -Path "$packageRoot/*" `
            -DestinationPath "package/$packageName.zip"

      - name: Upload unsigned direct-test package
        uses: actions/upload-artifact@v4
        with:
          name: OpenLR2-BMSIR-Arena-0.2.0-dev-openlr2-${{ matrix.arch }}-unsigned
          if-no-files-found: error
          path: package/OpenLR2-BMSIR-Arena-0.2.0-dev-openlr2-${{ matrix.arch }}.zip
