name: Arena Windows build

on:
  push:
    branches:
      - codex/issue-636-bmsir-arena
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            generator_arch: x64
            triplet: x64-windows-static-release
            executable: OpenLR2_x64.exe
          - arch: x86
            generator_arch: Win32
            triplet: x86-windows-static
            executable: OpenLR2_x86.exe

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: |
          if (-not $env:VCPKG_ROOT) {
            $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          }
          if (-not (Test-Path "$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake")) {
            throw "VCPKG_ROOT does not contain the vcpkg CMake toolchain"
          }
          cmake -S . -B "build/${{ matrix.arch }}" `
            -G "Visual Studio 17 2022" `
            -A "${{ matrix.generator_arch }}" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="${{ matrix.triplet }}" `
            -DBUILD_TESTING=ON

      - name: Build
        run: >-
          cmake --build "build/${{ matrix.arch }}"
          --config RelWithDebInfo
          --target OpenLR2 BMSIRArenaProtocolTest
          --parallel

      - name: Test protocol helpers
        run: >-
          ctest --test-dir "build/${{ matrix.arch }}"
          -C RelWithDebInfo
          --output-on-failure

      - name: Upload unsigned source-preview
        uses: actions/upload-artifact@v4
        with:
          name: OpenLR2-BMSIR-Arena-${{ matrix.arch }}-unsigned
          if-no-files-found: error
          path: |
            build/${{ matrix.arch }}/RelWithDebInfo/${{ matrix.executable }}
            build/${{ matrix.arch }}/RelWithDebInfo/OpenLR2_*.pdb
            BMSIR_ARENA.md
            BMSIR_ARENA.example.json
